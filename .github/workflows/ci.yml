name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build, types et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: Bout en bout
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: cp .env.example .env
      - name: Infra (Postgres, Valkey, RustFS, Mailpit, Gotenberg)
        run: docker compose up -d --wait postgres valkey rustfs mailpit gotenberg
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:migrate && pnpm db:seed
      - name: API, collab et worker
        run: |
          (cd apps/api && node dist/main.js > ../../api.log 2>&1 &)
          (cd apps/collab && node dist/main.js > ../../collab.log 2>&1 &)
          (cd apps/worker && node dist/main.js > ../../worker.log 2>&1 &)
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:3001/api/health > /dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:3001/api/health
      - run: tests/e2e/run.sh
      - name: Journaux des services
        if: failure()
        run: tail -n 200 api.log collab.log worker.log
