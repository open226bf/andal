# Andal en production: `docker compose -f deploy/compose.yaml --env-file deploy/.env up -d`
# Voir deploy/README.md (installation, premier compte, sauvegardes, mises à jour).

name: andal

x-server: &server
  image: ${ANDAL_IMAGE:-ghcr.io/open226bf/andal-server}:${ANDAL_VERSION:-latest}
  build: { context: .., target: server }
  restart: unless-stopped
  environment: &server-env
    NODE_ENV: production
    HOST: 0.0.0.0
    DATABASE_URL: postgres://andal:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}@postgres:5432/andal
    VALKEY_URL: redis://valkey:6379
    WEB_ORIGIN: ${ANDAL_ORIGIN:-https://${ANDAL_DOMAIN:-localhost}}
    AUTH_PASSWORD: ${AUTH_PASSWORD:-true}
    OIDC_ISSUER: ${OIDC_ISSUER:-}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
    OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    OIDC_LABEL: ${OIDC_LABEL:-SSO}
    OIDC_AUTO_CREATE: ${OIDC_AUTO_CREATE:-false}
    OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-}
    OIDC_GROUPS_SCOPE: ${OIDC_GROUPS_SCOPE:-}
    SMTP_URL: ${SMTP_URL:-}
    MAIL_FROM: ${MAIL_FROM:-Andal <andal@localhost>}
    NOTIFY_EMAIL_DELAY: ${NOTIFY_EMAIL_DELAY:-300}
    TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
    S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_BUCKET: ${S3_BUCKET:-andal}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY manquant}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY manquant}
    UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-25}
    IMPORT_MAX_MB: ${IMPORT_MAX_MB:-200}
    GOTENBERG_URL: ${GOTENBERG_URL-http://gotenberg:3000}
    PUBLIC_LINKS: ${PUBLIC_LINKS:-true}
    WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-false}
    WEBHOOK_UPDATE_DELAY: ${WEBHOOK_UPDATE_DELAY:-120}
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    JIRA_BASE_URL: ${JIRA_BASE_URL:-}
    JIRA_EMAIL: ${JIRA_EMAIL:-}
    JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
    AI_PROVIDER: ${AI_PROVIDER:-}
    AI_MODEL: ${AI_MODEL:-}
    AI_BASE_URL: ${AI_BASE_URL:-}
    AI_API_KEY: ${AI_API_KEY:-}
    RATE_LIMIT: ${RATE_LIMIT:-true}
    RATE_LIMIT_READS: ${RATE_LIMIT_READS:-600}
    RATE_LIMIT_WRITES: ${RATE_LIMIT_WRITES:-120}
    RATE_LIMIT_ANONYMOUS: ${RATE_LIMIT_ANONYMOUS:-120}
    TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
  depends_on:
    migrate: { condition: service_completed_successfully }
    valkey: { condition: service_healthy }

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: andal
      POSTGRES_USER: andal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andal -d andal"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - postgres:/var/lib/postgresql

  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - valkey:/data

  # Stockage des fichiers. Pour un S3 externe (MinIO, Garage, R2…), renseignez
  # S3_ENDPOINT et retirez ce service (voir deploy/README.md).
  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION:-latest}
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY manquant}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY manquant}
      RUSTFS_VOLUMES: /data
    volumes:
      - files:/data

  drawio:
    image: jgraph/drawio:${DRAWIO_VERSION:-latest}
    restart: unless-stopped

  # Export PDF: Chromium derrière une API HTTP, joignable seulement par l'API.
  gotenberg:
    image: gotenberg/gotenberg:${GOTENBERG_VERSION:-8}
    restart: unless-stopped

  # Met la base à jour, puis s'arrête; les services attendent qu'il ait réussi.
  migrate:
    <<: *server
    restart: "no"
    command: ["migrate"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *server
    command: ["api"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  collab:
    <<: *server
    command: ["collab"]

  worker:
    <<: *server
    command: ["worker"]

  web:
    image: ${ANDAL_WEB_IMAGE:-ghcr.io/open226bf/andal-web}:${ANDAL_VERSION:-latest}
    build: { context: .., target: web }
    restart: unless-stopped
    environment:
      ANDAL_DOMAIN: ${ANDAL_DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy:/data
    depends_on:
      api: { condition: service_healthy }
      collab: { condition: service_started }

volumes:
  postgres:
  valkey:
  files:
  caddy:
