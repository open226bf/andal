# Andal sur Docker Swarm. Voir deploy/swarm/README.md (étiquettes des nœuds,
# installation, premier compte, sauvegardes, mises à jour). Depuis la racine du
# dépôt, sur un manager:
#   set -a; . deploy/.env; set +a
#   docker stack deploy -c deploy/swarm/stack.yaml --with-registry-auth --detach=false andal
#
# Mêmes images et mêmes variables que deploy/compose.yaml: une variable ajoutée
# là-bas s'ajoute aussi ici.

x-server: &server
  image: ${ANDAL_IMAGE:-ghcr.io/open226bf/andal-server}:${ANDAL_VERSION:-latest}
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    DATABASE_URL: postgres://andal:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}@postgres:5432/andal
    VALKEY_URL: redis://valkey:6379
    WEB_ORIGIN: ${ANDAL_ORIGIN:-https://${ANDAL_DOMAIN:-localhost}}
    AUTH_PASSWORD: ${AUTH_PASSWORD:-true}
    OIDC_ISSUER: ${OIDC_ISSUER:-}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
    OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    OIDC_LABEL: ${OIDC_LABEL:-SSO}
    OIDC_AUTO_CREATE: ${OIDC_AUTO_CREATE:-false}
    OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-}
    OIDC_GROUPS_SCOPE: ${OIDC_GROUPS_SCOPE:-}
    SMTP_URL: ${SMTP_URL:-}
    MAIL_FROM: ${MAIL_FROM:-Andal <andal@localhost>}
    NOTIFY_EMAIL_DELAY: ${NOTIFY_EMAIL_DELAY:-300}
    TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
    S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_BUCKET: ${S3_BUCKET:-andal}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY manquant}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY manquant}
    UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-25}
    IMPORT_MAX_MB: ${IMPORT_MAX_MB:-200}
    GOTENBERG_URL: ${GOTENBERG_URL-http://gotenberg:3000}
    PUBLIC_LINKS: ${PUBLIC_LINKS:-true}
    WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-false}
    WEBHOOK_UPDATE_DELAY: ${WEBHOOK_UPDATE_DELAY:-120}
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    JIRA_BASE_URL: ${JIRA_BASE_URL:-}
    JIRA_EMAIL: ${JIRA_EMAIL:-}
    JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
    AI_PROVIDER: ${AI_PROVIDER:-}
    AI_MODEL: ${AI_MODEL:-}
    AI_BASE_URL: ${AI_BASE_URL:-}
    AI_API_KEY: ${AI_API_KEY:-}
    RATE_LIMIT: ${RATE_LIMIT:-true}
    RATE_LIMIT_READS: ${RATE_LIMIT_READS:-600}
    RATE_LIMIT_WRITES: ${RATE_LIMIT_WRITES:-120}
    RATE_LIMIT_ANONYMOUS: ${RATE_LIMIT_ANONYMOUS:-120}
    TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
  networks: [backend]

# Les volumes Swarm restent sur le nœud qui les a créés: les services qui
# gardent des données ne quittent pas le nœud étiqueté andal-data.
x-data-node: &data-node
  placement:
    constraints: [node.labels.andal-data == true]

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: andal
      POSTGRES_USER: andal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andal -d andal"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - postgres:/var/lib/postgresql
    networks: [backend]
    stop_grace_period: 1m
    deploy: *data-node

  valkey:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - valkey:/data
    networks: [backend]
    deploy: *data-node

  # Stockage des fichiers. Avec un S3 externe, retirez ce service et
  # renseignez S3_ENDPOINT: les fichiers ne dépendent plus d'un nœud.
  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION:-latest}
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY manquant}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY manquant}
      RUSTFS_VOLUMES: /data
    volumes:
      - files:/data
    networks: [backend]
    deploy: *data-node

  drawio:
    image: jgraph/drawio:${DRAWIO_VERSION:-latest}
    networks: [backend]

  # Export PDF: Chromium derrière une API HTTP, joignable seulement par l'API.
  gotenberg:
    image: gotenberg/gotenberg:${GOTENBERG_VERSION:-8}
    networks: [backend]

  # Met la base à jour puis s'arrête. Swarm ne sait pas faire attendre les
  # autres services: au premier déploiement, l'API, collab et le worker
  # redémarrent jusqu'à ce que la base soit prête.
  migrate:
    <<: *server
    command: ["migrate"]
    deploy:
      mode: replicated-job
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  api:
    <<: *server
    command: ["api"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      update_config:
        order: start-first
        failure_action: rollback

  # dnsrr: le nom « collab » renvoie l'adresse de chaque instance, et Caddy
  # répartit lui-même les WebSockets (voir deploy/Caddyfile).
  collab:
    <<: *server
    command: ["collab"]
    deploy:
      endpoint_mode: dnsrr
      replicas: ${COLLAB_REPLICAS:-1}
      update_config:
        order: start-first

  worker:
    <<: *server
    command: ["worker"]

  # Ports en mode host: Caddy voit l'adresse réelle des visiteurs (le maillage
  # d'entrée de Swarm la remplacerait par la sienne). Une seule instance, sur le
  # nœud étiqueté andal-edge, vers lequel pointe le DNS; ses certificats restent
  # dans son volume.
  web:
    image: ${ANDAL_WEB_IMAGE:-ghcr.io/open226bf/andal-web}:${ANDAL_VERSION:-latest}
    environment:
      ANDAL_DOMAIN: ${ANDAL_DOMAIN:-localhost}
    ports:
      - { target: 80, published: "${HTTP_PORT:-80}", protocol: tcp, mode: host }
      - { target: 443, published: "${HTTPS_PORT:-443}", protocol: tcp, mode: host }
      - { target: 443, published: "${HTTPS_PORT:-443}", protocol: udp, mode: host }
    volumes:
      - caddy:/data
    networks: [backend]
    deploy:
      placement:
        constraints: [node.labels.andal-edge == true]

networks:
  backend:
    driver: overlay
    # Pour lancer une commande ponctuelle sur le réseau (docker run --network andal_backend).
    attachable: true

volumes:
  postgres:
  valkey:
  files:
  caddy:
